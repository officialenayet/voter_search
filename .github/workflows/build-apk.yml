name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # সোর্স ZIP আকারে আপলোড করা থাকলে নিজেই খুলে নেয় (মোবাইল থেকে ফোল্ডার আপলোড না করার জন্য)
      - name: Find project (unzip if uploaded as ZIP)
        run: |
          if ls *.zip >/dev/null 2>&1; then
            for z in *.zip; do unzip -q -o "$z" -d _src; done
          fi
          if [ -d _src ]; then
            F=$(find _src -name settings.gradle.kts | head -1)
          else
            F=$(find . -name settings.gradle.kts | head -1)
          fi
          echo "Found: $F"
          echo "PROJECT_DIR=$(dirname "$F")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoterSearch-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
